name: Supabase Keepalive

on:
  schedule:
    # 3x/jour pour une marge de sécurité (Supabase pause après 7j d'inactivité)
    - cron: '0 6 * * *'   # 6h UTC  (~2h  heure de l'Est)
    - cron: '0 14 * * *'  # 14h UTC (~10h heure de l'Est)
    - cron: '0 22 * * *'  # 22h UTC (~18h heure de l'Est)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (UPDATE réel sur team_states)
        env:
          SUPABASE_URL: "https://atkunsjbyowcpddrfsre.supabase.co"
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            "$SUPABASE_URL/rest/v1/team_states?team_code=eq.TEI_USINE" \
            -d '{"team_code":"TEI_USINE"}' \
            -w "\nHTTP_STATUS:%{http_code}\n"
