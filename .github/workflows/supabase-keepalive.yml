name: Supabase Keepalive

on:
  schedule:
    # Tous les jours à 10h00 UTC (~6h00 heure de l'Est)
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (UPDATE réel sur team_states)
        env:
          SUPABASE_URL: "https://atkunsjbyowcpddrfsre.supabase.co"
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            "$SUPABASE_URL/rest/v1/team_states?team_code=eq.TEI_USINE" \
            -d '{"team_code":"TEI_USINE"}' \
            -w "\nHTTP_STATUS:%{http_code}\n"
